# Copy to .github/workflows/pages.yml in the public frontend-only repository.
# That repository contains compiled frontend files in site/, with no private source or secrets.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out compiled frontend
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
